name: Build Ace Launcher Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Paketleri Yükle
        run: npm install

      - name: Vite Build Al
        run: npm run build

      - name: Windows Setup.exe Oluştur
        run: npx electron-builder --win --x64 --publish never

      - name: Setup Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Ace-Launcher-Setup
          path: dist-electron/*.exe
